name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm run test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: pnpm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/build

  deploy-gcp:
    name: Deploy to Google Cloud
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          export_default_credentials: true
      
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
      
      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/skycoin4444:${{ github.ref_name }} \
            --build-arg ENVIRONMENT=production \
            -f infrastructure/docker/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/skycoin4444:${{ github.ref_name }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy skycoin4444-production \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/skycoin4444:${{ github.ref_name }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars ENVIRONMENT=production,VERSION=${{ github.ref_name }}

  deploy-aws:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: skycoin4444
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --build-arg ENVIRONMENT=production \
            -f infrastructure/docker/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/aws/cloudformation.yaml \
            --stack-name skycoin4444-production \
            --parameter-overrides \
              Environment=production \
              ImageUri=${{ steps.login-ecr.outputs.registry }}/skycoin4444:${{ github.ref_name }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM

  deploy-ios:
    name: Deploy to iOS App Store
    needs: build
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      
      - name: Build iOS app
        run: |
          cd apps/mobile
          eas build --platform ios --build-type release --non-interactive
      
      - name: Submit to App Store
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          cd apps/mobile
          eas submit --platform ios --latest --non-interactive

  deploy-android:
    name: Deploy to Android Play Store
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      
      - name: Build Android app
        run: |
          cd apps/mobile
          eas build --platform android --build-type release --non-interactive
      
      - name: Submit to Play Store
        env:
          GOOGLE_PLAY_KEY_FILE: ${{ secrets.GOOGLE_PLAY_KEY_FILE }}
        run: |
          cd apps/mobile
          eas submit --platform android --latest --non-interactive

  notify:
    name: Notify Deployment
    needs: [deploy-gcp, deploy-aws, deploy-ios, deploy-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "Deployment Status:"
          echo "GCP: ${{ needs.deploy-gcp.result }}"
          echo "AWS: ${{ needs.deploy-aws.result }}"
          echo "iOS: ${{ needs.deploy-ios.result }}"
          echo "Android: ${{ needs.deploy-android.result }}"
      
      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "SKYCOIN4444 Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*SKYCOIN4444 Production Deployment*\nVersion: ${{ github.ref_name }}\nStatus: ${{ job.status }}"
                  }
                }
              ]
            }
